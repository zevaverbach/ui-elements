<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timer</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/zevaverbach/ui-elements@main/tokens.css">
<style>
  body { margin: 0; padding: 16px; background: var(--ui-color-bg); color: var(--ui-color-text); font-family: var(--ui-font); }
  ui-countdown { max-width: 320px; }
</style>
<script type="module" src="https://cdn.jsdelivr.net/gh/zevaverbach/ui-elements@main/components/ui-countdown.js"></script>
</head>
<body>

<main id="outlet">
  <h1>Timer</h1>
  <ui-countdown id="timer" seconds="60" label="Start timer"><strong slot="done">Time's up!</strong></ui-countdown>
</main>
</body>
</html>
